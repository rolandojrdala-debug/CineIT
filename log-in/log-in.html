<!DOCTYPE html>

<html lang="en" data-theme="dark">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#050705">

  <title>CineIT | Account Access</title>



  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">



  <link rel="stylesheet" href="log-in.css">


</head>



<body>



  <!-- =====================================

       TOP NAVIGATION

  ===================================== -->



  <header class="topbar">



    <a class="logo" href="../index.html">
      <span class="logo-icon" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
      </span>
      <span>Cine<span>IT</span></span>
    </a>

    <div class="topbar-right">
    <a href="../index.html">HOME</a>
    <span class="topbar-dot"></span>

    <a href="../cinemas/cinemas.html">CINEMAS</a>
    <span class="topbar-dot"></span>

    <a href="../index.html#now-showing">FILMS</a>
    <span class="topbar-dot"></span>

    <a href="./log-in.html">Log In/Sign Up</a>
      <button type="button" id="themeToggle" class="theme-toggle">
        ☀️ Light Mode
      </button>



    </div>

  </header>



  <!-- =====================================

       LOGIN CONTAINER

  ===================================== -->



  <main class="login-container">



    <div class="access-card">



      <div class="card-header">

        <h2>Account Access</h2>

        <p>Book tickets, save preferences, and manage your watchlist.</p>

      </div>



      <!-- TABS -->



      <div class="tabs">



        <button type="button" class="tab-btn active" data-target="signin">

          Sign In

        </button>



        <button type="button" class="tab-btn" data-target="register">

          Create Account

        </button>



      </div>



      <!-- AUTHENTICATION MESSAGE -->



      <div

        id="auth-message"

        class="auth-message"

        role="status"

        aria-live="polite">

      </div>



      <!-- =====================================

           SIGN IN FORM

      ===================================== -->



      <form class="auth-form active" id="signin">



        <div class="field">

          <label for="signin-email">Email Address</label>



          <input

            type="email"

            id="signin-email"

            placeholder="name@email.com"

            autocomplete="email"

            required>

        </div>



        <div class="field">

          <label for="signin-password">Password</label>



          <input

            type="password"

            id="signin-password"

            placeholder="Enter your password"

            autocomplete="current-password"

            required>

        </div>



        <button type="submit" class="primary">

          Sign In →

        </button>



      </form>



      <!-- =====================================

           REGISTER FORM

      ===================================== -->



      <form class="auth-form" id="register">



        <div class="field">

          <label for="reg-name">Full Name</label>



          <input

            type="text"

            id="reg-name"

            placeholder="John Doe"

            minlength="2"

            maxlength="100"

            autocomplete="name"

            required>

        </div>



        <div class="field">

          <label for="reg-email">Email Address</label>



          <input

            type="email"

            id="reg-email"

            placeholder="name@email.com"

            maxlength="150"

            autocomplete="email"

            required>

        </div>



        <div class="field">

          <label for="reg-password">Password</label>



          <input

            type="password"

            id="reg-password"

            placeholder="Create a strong password"

            minlength="12"

            maxlength="128"

            autocomplete="new-password"

            required>

        </div>



        <div class="consent-field">



          <input

            type="checkbox"

            id="terms"

            required>



          <label for="terms">

            I agree to the

            <a href="#">Terms</a> &

            <a href="#">Privacy Policy</a>

          </label>



        </div>



        <button type="submit" class="primary">

          Create Account →

        </button>



      </form>



      <!-- FOOTER -->



      <div class="card-footer">

        <p>© 2026 CineIT · Cinema starts here</p>

      </div>



    </div>



  </main>



  <!-- =====================================

       JAVASCRIPT

  ===================================== -->



  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="log-in.js"></script>



</body>

</html>
