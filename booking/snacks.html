<!doctype html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050705">
    <title>Snacks & Concessions | CineIT</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Shared CineIT Root Stylesheet -->
    <link rel="stylesheet" href="../index.css">

    <style>
        .summary-poster-row {
            display: flex;
            gap: 16px;
            align-items: center;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 18px;
        }

        .summary-thumb {
            width: 72px;
            aspect-ratio: 2 / 3;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--line);
        }

        .summary-details-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 13px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .summary-row span:first-child {
            color: var(--muted);
            font-weight: 600;
        }

        .summary-row span:last-child {
            font-weight: 700;
            text-align: right;
        }

        .category-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .cat-pill {
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--secondary-bg);
            color: var(--muted);
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .cat-pill:hover,
        .cat-pill.active {
            border-color: var(--green);
            color: var(--green);
            background: var(--panel);
        }

        .snacks-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 460px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .snack-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 12px;
            background: var(--secondary-bg);
            border: 1px solid var(--line);
            transition: border-color 0.2s;
        }

        .snack-item.has-qty {
            border-color: var(--green);
        }

        .snack-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .snack-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--panel);
            border: 1px solid var(--line);
            display: grid;
            place-items: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .snack-info h4 {
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 2px;
        }

        .snack-info p {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.4;
        }

        .snack-price {
            font-size: 12px;
            font-weight: 800;
            color: var(--green);
            margin-top: 4px;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .qty-btn:hover {
            border-color: var(--green);
            color: var(--green);
        }

        .qty-val {
            min-width: 18px;
            text-align: center;
            font-size: 13px;
            font-weight: 800;
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 12px;
            margin-top: 16px;
        }

        .secondary-btn {
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--secondary-bg);
            color: var(--text);
            font-family: inherit;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .secondary-btn:hover {
            border-color: var(--green);
            color: var(--green);
        }

        .total-bar {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 800;
        }
    </style>
</head>

<body>

    <!-- Top Navigation -->
    <header class="topbar">
        <a class="logo" href="../index.html">
            <span class="logo-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span>Cine<span>IT</span></span>
        </a>
        <div class="topbar-right">
            <a href="../index.html">HOME</a>
            <span class="topbar-dot"></span>
            <a href="../cinemas/cinemas.html">CINEMAS</a>
            <span class="topbar-dot"></span>
            <a href="../index.html#now-showing">FILMS</a>
            <span class="topbar-dot"></span>
            <a href="../log-in/log-in.html" id="nav-auth-link">LOG IN / SIGN UP</a>
            <button type="button" id="themeToggle" class="theme-toggle">☀️ Light Mode</button>
        </div>
    </header>

    <main class="landing-main">
        <div class="section-header">
            <h2>Add Cinema Snacks</h2>
            <div class="section-line"></div>
        </div>

        <section class="hero-split" style="align-items: flex-start; grid-template-columns: 0.95fr 1.25fr;">

            <!-- Left: Live Booking Summary -->
            <div class="access-card" style="padding: 28px;">
                <div class="summary-poster-row">
                    <img id="sum-poster" src="" alt="Poster" class="summary-thumb">
                    <div>
                        <span style="font-size: 10px; font-weight: 800; color: var(--green); letter-spacing: 1px;">YOUR SCREENING</span>
                        <h3 id="sum-title" style="font-size: 18px; font-weight: 800; margin: 3px 0;">Movie Title</h3>
                        <p id="sum-info" style="font-size: 12px; color: var(--muted); font-weight: 600;"></p>
                    </div>
                </div>

                <div class="summary-details-list">
                    <div class="summary-row">
                        <span>Cinema</span>
                        <span id="sum-cinema">—</span>
                    </div>
                    <div class="summary-row">
                        <span>Format</span>
                        <span id="sum-format">—</span>
                    </div>
                    <div class="summary-row">
                        <span>Date & Time</span>
                        <span id="sum-datetime">—</span>
                    </div>
                    <div class="summary-row">
                        <span>Seats</span>
                        <span id="sum-seats" style="color: var(--green);">—</span>
                    </div>
                    <div class="summary-row" style="padding-top: 10px; border-top: 1px dashed var(--line);">
                        <span>Tickets Subtotal</span>
                        <span id="sum-tickets-price">₱0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Snacks & Drinks</span>
                        <span id="sum-snacks-price">₱0.00</span>
                    </div>
                </div>

                <div id="selected-snacks-list" style="margin-top: 12px; font-size: 12px; color: var(--muted);"></div>

                <div class="total-bar">
                    <span>Running Total</span>
                    <span id="sum-grand-total" style="color: var(--green);">₱0.00</span>
                </div>
            </div>

            <!-- Right: Step 2 Concessions Selection -->
            <div class="access-card">
                <div class="tabs">
                    <button type="button" class="tab-btn" onclick="window.location.href='booking.html'">1. Seats</button>
                    <button type="button" class="tab-btn active">2. Snacks</button>
                    <button type="button" class="tab-btn" disabled style="opacity:0.55;cursor:not-allowed;">3. Payment</button>
                    <button type="button" class="tab-btn" disabled style="opacity:0.55;cursor:not-allowed;">4. Ticket</button>
                </div>

                <div class="category-pills" id="category-pills">
                    <button type="button" class="cat-pill active" data-cat="all">All Items</button>
                    <button type="button" class="cat-pill" data-cat="combos">Combos</button>
                    <button type="button" class="cat-pill" data-cat="popcorn">Popcorn</button>
                    <button type="button" class="cat-pill" data-cat="drinks">Drinks</button>
                    <button type="button" class="cat-pill" data-cat="bites">Hot Bites</button>
                </div>

                <div class="snacks-list" id="snacks-list"></div>

                <div class="action-row">
                    <button type="button" class="secondary-btn" onclick="window.location.href='booking.html'">← Back to Seats</button>
                    <button type="button" class="primary" id="proceed-payment-btn">Proceed to Payment →</button>
                </div>
            </div>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>
    <script>
        const themeToggle = document.getElementById("themeToggle");
        let currentTheme = localStorage.getItem("cineit-theme") || "dark";
        function applyTheme() {
            document.documentElement.setAttribute("data-theme", currentTheme);
            themeToggle.textContent = currentTheme === "dark" ? "☀️ Light Mode" : "🌙 Dark Mode";
        }
        applyTheme();
        themeToggle.addEventListener("click", () => {
            currentTheme = currentTheme === "dark" ? "light" : "dark";
            localStorage.setItem("cineit-theme", currentTheme);
            applyTheme();
        });

        if (window.cineitSupabase) {
            window.cineitSupabase.auth.getSession().then(({ data }) => {
                const user = data?.session?.user;
                if (user) {
                    const navLink = document.getElementById("nav-auth-link");
                    navLink.textContent = (user.user_metadata?.full_name || user.email).toUpperCase();
                    navLink.href = "../index.html";
                }
            });
        }

        const booking = JSON.parse(sessionStorage.getItem("cineit_booking") || "null");
        if (!booking || !booking.seats || booking.seats.length === 0) {
            window.location.replace("booking.html");
        }

        const formatPHP = (n) => `₱${Number(n).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        document.getElementById("sum-poster").src = booking.moviePoster;
        document.getElementById("sum-title").textContent = booking.movieTitle;
        document.getElementById("sum-info").textContent = booking.movieInfo;
        document.getElementById("sum-cinema").textContent = booking.cinema;
        document.getElementById("sum-format").textContent = booking.format;
        document.getElementById("sum-datetime").textContent = `${booking.date} • ${booking.time}`;
        document.getElementById("sum-seats").textContent = booking.seats.join(", ");
        document.getElementById("sum-tickets-price").textContent = formatPHP(booking.ticketSubtotal);

        const SNACK_MENU = [
            { id: "combo-duo", category: "combos", icon: "🍿", name: "CineIT Blockbuster Duo", desc: "1 Large Caramel Popcorn + 2 Regular Sodas + Nachos", price: 395 },
            { id: "combo-solo", category: "combos", icon: "🥤", name: "Solo Feature Combo", desc: "1 Medium Butter Popcorn + 1 Iced Cola", price: 230 },
            { id: "pop-caramel", category: "popcorn", icon: "🍯", name: "Large Gourmet Caramel Popcorn", desc: "Freshly popped glazed caramel kernels", price: 185 },
            { id: "pop-cheese", category: "popcorn", icon: "🧀", name: "Large White Cheddar Popcorn", desc: "Savory aged white cheddar seasoning", price: 175 },
            { id: "bite-nachos", category: "bites", icon: "🌮", name: "Loaded Jalapeño Nachos", desc: "Crispy tortilla chips with warm cheese & salsa", price: 190 },
            { id: "bite-hotdog", category: "bites", icon: "🌭", name: "Jumbo Cinema Beef Frank", desc: "Grilled all-beef hotdog with mustard & relish", price: 165 },
            { id: "drink-soda", category: "drinks", icon: "🧊", name: "Large Iced Cola / Lemon-Lime", desc: "32oz fountain drink with crushed ice", price: 95 },
            { id: "drink-water", category: "drinks", icon: "💧", name: "Bottled Mineral Water (500ml)", desc: "Chilled purified drinking water", price: 55 }
        ];

        const quantities = {};
        if (Array.isArray(booking.snacks)) {
            booking.snacks.forEach(item => {
                quantities[item.id] = item.qty;
            });
        }

        let activeCategory = "all";
        const snacksListEl = document.getElementById("snacks-list");

        function renderSnacks() {
            const filtered = activeCategory === "all"
                ? SNACK_MENU
                : SNACK_MENU.filter(item => item.category === activeCategory);

            snacksListEl.innerHTML = filtered.map(item => {
                const qty = quantities[item.id] || 0;
                return `
                    <div class="snack-item ${qty > 0 ? "has-qty" : ""}">
                        <div class="snack-left">
                            <div class="snack-icon">${item.icon}</div>
                            <div class="snack-info">
                                <h4>${item.name}</h4>
                                <p>${item.desc}</p>
                                <div class="snack-price">${formatPHP(item.price)}</div>
                            </div>
                        </div>
                        <div class="qty-controls">
                            <button type="button" class="qty-btn" data-action="dec" data-id="${item.id}">−</button>
                            <span class="qty-val">${qty}</span>
                            <button type="button" class="qty-btn" data-action="inc" data-id="${item.id}">+</button>
                        </div>
                    </div>
                `;
            }).join("");

            updateTotals();
        }

        function updateTotals() {
            const selectedSnacks = SNACK_MENU
                .filter(item => (quantities[item.id] || 0) > 0)
                .map(item => ({
                    id: item.id,
                    name: item.name,
                    price: item.price,
                    qty: quantities[item.id],
                    subtotal: item.price * quantities[item.id]
                }));

            const snacksSubtotal = selectedSnacks.reduce((acc, s) => acc + s.subtotal, 0);
            const grandTotal = booking.ticketSubtotal + snacksSubtotal;

            document.getElementById("sum-snacks-price").textContent = formatPHP(snacksSubtotal);
            document.getElementById("sum-grand-total").textContent = formatPHP(grandTotal);

            const listContainer = document.getElementById("selected-snacks-list");
            if (selectedSnacks.length === 0) {
                listContainer.innerHTML = `<span style="font-style: italic;">No snacks added (optional)</span>`;
            } else {
                listContainer.innerHTML = selectedSnacks
                    .map(s => `<div style="display:flex;justify-content:space-between;margin-top:4px;"><span>${s.qty}× ${s.name}</span><span>${formatPHP(s.subtotal)}</span></div>`)
                    .join("");
            }

            return { selectedSnacks, snacksSubtotal };
        }

        snacksListEl.addEventListener("click", (e) => {
            const btn = e.target.closest(".qty-btn");
            if (!btn) return;
            const id = btn.dataset.id;
            const action = btn.dataset.action;
            const current = quantities[id] || 0;
            if (action === "inc") {
                quantities[id] = Math.min(10, current + 1);
            } else if (action === "dec") {
                quantities[id] = Math.max(0, current - 1);
            }
            renderSnacks();
        });

        document.getElementById("category-pills").addEventListener("click", (e) => {
            const pill = e.target.closest(".cat-pill");
            if (!pill) return;
            document.querySelectorAll(".cat-pill").forEach(p => p.classList.remove("active"));
            pill.classList.add("active");
            activeCategory = pill.dataset.cat;
            renderSnacks();
        });

        document.getElementById("proceed-payment-btn").addEventListener("click", () => {
            const { selectedSnacks, snacksSubtotal } = updateTotals();
            booking.snacks = selectedSnacks;
            booking.snacksSubtotal = snacksSubtotal;
            sessionStorage.setItem("cineit_booking", JSON.stringify(booking));
            window.location.href = "payment.html";
        });

        renderSnacks();
    </script>
</body>
</html>
